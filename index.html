function esc(v) {
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

}
function getYouTubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/) || url.match(/[?&]v=([a-zA-Z0-9_-]{11})/) || url.trim().match(/^([a-zA-Z0-9_-]{11})$/);
  return m ? m[1] : null;
}
function getDriveId(url) {
  if (!url) return null;
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}
function normalizeMedia(url, type) {
  const id = getDriveId(url);
  if (!id) return url;
  return type === 'image' ? `https://drive.google.com/thumbnail?id=${id}&sz=w1600` : `https://drive.google.com/file/d/${id}/preview`;
}
function isIframeVideo(url) { return /drive\.google\.com|youtube\.com|youtu\.be/.test(url || ''); }

function uploadCloudinary(file, onProgress) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_PRESET);
    fd.append('folder', 'surf-giants');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`);
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded/e.total)*100)); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        const res = JSON.parse(xhr.responseText);
        const isVid = res.resource_type === 'video' || file.type.startsWith('video/');
        let url = res.secure_url;
        if (!isVid && url.includes('/image/upload/')) {
          url = url.replace('/image/upload/', '/image/upload/f_auto,q_auto,w_1600,c_limit/');
        } else if (isVid && url.includes('/video/upload/')) {
          url = url.replace('/video/upload/', '/video/upload/f_auto,q_auto/');
        }
        resolve({ url, mediaType: isVid ? 'video' : 'image' });
      } else {
        reject(new Error(`Failed "${file.name}" (max 100MB per file).`));
      }
    };
    xhr.onerror = () => reject(new Error(`Network error uploading "${file.name}".`));
    xhr.send(fd);
  });
}

  state.gallery = gRes.data || [];
  state.partners = pRes.data || [];
  if (state.user) {
    const msgRes = await sb.from('contact_messages').select('*').order('created_at', { ascending: false });
    state.messages = msgRes.data || [];
  }
  state.loading = false;
  render();
}

function openLightbox(type, url, caption) {
  const lb = document.getElementById('lightbox');
  const body = document.getElementById('lightbox-body');
  const cleanUrl = normalizeMedia(url, type);
  let mediaEl = '';
  if (type === 'video') {
    mediaEl = isIframeVideo(cleanUrl)
      ? `<iframe src="${esc(cleanUrl)}" class="w-full aspect-video bg-black" allowfullscreen></iframe>`
      : `<video src="${esc(cleanUrl)}" controls autoplay class="w-full max-h-[75vh] bg-black"></video>`;
  } else {
    mediaEl = `<img src="${esc(cleanUrl)}" class="w-full max-h-[75vh] object-contain bg-black" />`;
  }
  body.innerHTML = `${mediaEl}<p class="p-4 text-sm text-cream">${esc(caption)}</p>`;
  lb.classList.remove('hidden'); lb.classList.add('flex');
}
function closeLightbox() {
  const lb = document.getElementById('lightbox');
  lb.classList.add('hidden'); lb.classList.remove('flex');

}

async function submitContact(e) {
  e.preventDefault();
  const { error } = await sb.from('contact_messages').insert({
    sender_name: document.getElementById('c-name').value,
    sender_email: document.getElementById('c-email').value,
    subject: document.getElementById('c-subj').value || 'Website Message',
    message: document.getElementById('c-msg').value
  });
  if (error) return alert('Error sending message: ' + error.message);
  e.target.reset();
  const st = document.getElementById('c-status');
  st.textContent = t('Message sent! Thank you for reaching out.', 'Το μήνυμα στάλθηκε! Ευχαριστούμε.');
  st.classList.remove('hidden');
}

        </div>
        <button type="submit" class="rounded-xl bg-aegean text-obsidian font-extrabold text-sm py-2.5">${editM ? 'Save Member Changes' : '+ Add Member'}</button>
      </form>
      <div class="space-y-2">
        ${state.members.map(m => `
          <div class="flex items-center justify-between gap-3 p-3 rounded-xl bg-obsidian border ${state.editingMemberId === m.id ? 'border-aegean' : 'border-white/10'} text-sm">
            <div class="flex items-center gap-3 min-w-0">
              ${m.photo_url ? `<img src="${esc(normalizeMedia(m.photo_url,'image'))}" class="w-10 h-10 rounded-lg object-cover shrink-0" />` : ''}
              <div class="min-w-0">
                <strong class="block truncate">${esc(m.name)}</strong>
                <span class="text-xs text-cream/60 block truncate">${esc(m.role_en)} ${m.is_tribute ? '• (Tribute)' : ''}</span>
              </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <button onclick="startEditMember('${m.id}')" class="text-aegean text-xs font-bold hover:underline">Edit</button>
              <button onclick="delRow('band_members','${m.id}')" class="text-crimson text-xs font-bold hover:underline">Remove</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (state.adminTab === 'partners') {
    body = `
      <form onsubmit="addPartner(event)" class="grid md:grid-cols-2 gap-3 mb-6 p-4 rounded-2xl bg-obsidian border border-white/10">
        <input id="p-name" required placeholder="Partner Name" class="rounded-xl bg-stage border border-white/15 px-3 py-2 text-sm text-cream" />
        <input id="p-tag" placeholder="Category (e.g. Venue, Radio, Gear)" class="rounded-xl bg-stage border border-white/15 px-3 py-2 text-sm text-cream" />
        <input id="p-url" placeholder="Website URL (https://...)" class="rounded-xl bg-stage border border-white/15 px-3 py-2 text-sm text-cream" />
        <input id="p-logo" type="file" accept="image/*" class="text-xs text-cream/80 self-center" />
        <input id="p-den" placeholder="Description (EN)" class="rounded-xl bg-stage border border-white/15 px-3 py-2 text-sm text-cream" />
        <input id="p-del" placeholder="Description (EL)" class="rounded-xl bg-stage border border-white/15 px-3 py-2 text-sm text-cream" />
        <button type="submit" class="md:col-span-2 rounded-xl bg-aegean text-obsidian font-extrabold text-sm py-2.5">+ Add Partner</button>
      </form>
      <div class="space-y-2">
        ${state.partners.map(p => `
          <div class="flex items-center justify-between p-3 rounded-xl bg-obsidian border border-white/10 text-sm">
            <div><strong>${esc(p.name)}</strong> <span class="text-xs text-cream/60">${esc(p.tag)}</span></div>
            <button onclick="delRow('partners','${p.id}')" class="text-crimson text-xs font-bold">Remove</button>
          </div>
        `).join('')}
      </div>
    `;
  } else if (state.adminTab === 'inbox') {
    body = state.messages.length ? `
      <div class="space-y-3">
        ${state.messages.map(msg => `
          <div class="p-4 rounded-2xl bg-obsidian border border-white/10 space-y-1">
            <div class="flex justify-between items-center text-xs text-cream/55">
              <span>${esc(msg.sender_name)} (${esc(msg.sender_email)})</span>
              <button onclick="delRow('contact_messages','${msg.id}')" class="text-crimson font-bold">Delete</button>
            </div>
            <p class="font-bold text-sm text-aegean">${esc(msg.subject)}</p>
            <p class="text-sm text-cream/85 whitespace-pre-line">${esc(msg.message)}</p>
          </div>
        `).join('')}
      </div>
    ` : `<p class="text-sm text-cream/60">No contact messages yet.</p>`;
  }

  return `
    <section class="max-w-5xl mx-auto px-4 py-10 space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="font-display text-3xl text-cream">Surf Giants Admin</h1>
          <p class="text-xs text-cream/60">Signed in as ${esc(state.user.email)}</p>
        </div>
        <button onclick="adminLogout()" class="px-4 py-2 rounded-xl border border-white/15 text-xs font-bold text-cream/80 hover:text-white">Sign Out</button>
      </div>
      <div class="flex flex-wrap gap-2">
        ${tabs.map(([k, lbl]) => `
          <button onclick="state.adminTab='${k}';render()" class="px-4 py-2 rounded-xl text-xs font-bold transition ${state.adminTab === k ? 'bg-aegean text-obsidian' : 'bg-stage border border-white/10 text-cream/75'}">${lbl}</button>
        `).join('')}
      </div>
      <div class="rounded-3xl bg-stage border border-white/10 p-6">${body}</div>
    </section>
  `;
}

async function adminLogin(e) {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('l-email').value.trim(),
    password: document.getElementById('l-pass').value
  });
  if (error) {
    const el = document.getElementById('l-err');
    el.textContent = error.message; el.classList.remove('hidden');
  }
}
async function adminLogout() { await sb.auth.signOut(); }

async function clearLogo() {
  state.settings.logoUrl = '';
  await sb.from('site_settings').upsert({ id: 'main', data: state.settings, updated_at: new Date().toISOString() });
  await loadAllData();
}

async function saveSettings(e) {
  e.preventDefault();
  let logoUrl = state.settings.logoUrl;
  const f = document.getElementById('a-logo-file').files[0];
  if (f) { const up = await uploadCloudinary(f); logoUrl = up.url; }
  const data = {
    ...state.settings, logoUrl,
    bookingEmail: document.getElementById('a-email').value,
    phonePrimary: document.getElementById('a-phone1').value,
    phoneSecondary: document.getElementById('a-phone2').value,
    locationEn: document.getElementById('a-loc-en').value,
    locationEl: document.getElementById('a-loc-el').value,
    instagramUrl: document.getElementById('a-ig').value,
    facebookUrl: document.getElementById('a-fb').value,
    youtubeChannelUrl: document.getElementById('a-yt').value,
    spotifyUrl: document.getElementById('a-sp').value,
    heroBadgeEn: document.getElementById('a-badge-en').value,
    heroBadgeEl: document.getElementById('a-badge-el').value,
    taglineEn: document.getElementById('a-tag-en').value,
    taglineEl: document.getElementById('a-tag-el').value,
    storyTitleEn: document.getElementById('a-st-en').value,
    storyTitleEl: document.getElementById('a-st-el').value,
    storyTextEn: document.getElementById('a-story-en').value,
    storyTextEl: document.getElementById('a-story-el').value,
    tributeTitleEn: document.getElementById('a-tr-en').value,
    tributeTitleEl: document.getElementById('a-tr-el').value
  };
  const { error } = await sb.from('site_settings').upsert({ id: 'main', data, updated_at: new Date().toISOString() });
  if (error) return alert(error.message);
  await loadAllData();
  alert('Saved!');
}

async function addVideo(e) {
  e.preventDefault();
  const titleEn = document.getElementById('v-ten').value;
  const { error } = await sb.from('youtube_videos').insert({
    youtube_url: document.getElementById('v-url').value.trim(),
    title_en: titleEn, title_el: document.getElementById('v-tel').value || titleEn,
    description_en: document.getElementById('v-den').value,
    description_el: document.getElementById('v-del').value || document.getElementById('v-den').value,
    is_featured: document.getElementById('v-feat').checked, sort_order: 1
  });
  if (error) return alert(error.message);
  await loadAllData();
}

function updateFileCount() {
  const n = document.getElementById('g-file')?.files?.length || 0;
  const el = document.getElementById('g-count');
  if (!el) return;
  if (n > 0) { el.textContent = `${n} file${n > 1 ? 's' : ''} selected and ready to upload!`; el.classList.remove('hidden'); }
  else { el.classList.add('hidden'); }
}

async function addGallery(e) {
  e.preventDefault();
  const files = Array.from(document.getElementById('g-file').files || []);
  const pastedUrl = document.getElementById('g-url').value.trim();
  if (!files.length && !pastedUrl) return alert('Select one or more photos/MP4s OR paste a link.');

  const btn = document.getElementById('g-btn');
  const wrap = document.getElementById('g-prog-wrap');
  const bar = document.getElementById('g-prog');
  const statusEl = document.getElementById('g-status');
  const cat = document.getElementById('g-cat').value;
  const baseCen = document.getElementById('g-cen').value.trim();
  const baseCel = document.getElementById('g-cel').value.trim();
  const catLabels = {
    live: ['Live Shows', 'Συναυλίες'],
    studio: ['Studio', 'Στούντιο'],
    vibes: ['Surf Vibes', 'Surf Κλίμα']
  };

  btn.disabled = true;
  wrap.classList.remove('hidden');
  statusEl.classList.remove('hidden');

  if (files.length) {
    let ok = 0;
    const failed = [];
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      btn.textContent = `Uploading ${i + 1} / ${files.length}...`;
      statusEl.textContent = `Uploading ${i + 1} of ${files.length}: ${file.name}`;
      try {
        const up = await uploadCloudinary(file, pct => {
          const totalPct = Math.round(((i + pct / 100) / files.length) * 100);
          bar.style.width = totalPct + '%';
        });
        const cen = baseCen ? (files.length > 1 ? `${baseCen} #${i + 1}` : baseCen) : catLabels[cat][0];
        const cel = baseCel ? (files.length > 1 ? `${baseCel} #${i + 1}` : baseCel) : (baseCen ? cen : catLabels[cat][1]);
        const { error } = await sb.from('gallery_items').insert({
          media_type: up.mediaType, media_url: up.url,
          caption_en: cen, caption_el: cel, category: cat
        });
        if (error) throw error;
        ok++;
      } catch (err) {
        failed.push(`${file.name} (${err.message})`);
      }
    }
    btn.disabled = false; btn.textContent = 'Upload All Selected';
    wrap.classList.add('hidden'); bar.style.width = '0%'; statusEl.classList.add('hidden');
    await loadAllData();
    if (failed.length) alert(`Uploaded ${ok} of ${files.length}.\n\nSkipped:\n${failed.join('\n')}`);
    else alert(`All ${ok} files uploaded to Gallery!`);
    return;
  }

  try {
    const mediaType = /\.(mp4|mov|webm)/i.test(pastedUrl) ? 'video' : 'image';
    const cen = baseCen || catLabels[cat][0]
